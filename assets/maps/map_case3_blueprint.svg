<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
<title id="title">Case 3 평면도</title>
<desc id="desc">실제 게임 방 번호와 연결을 반영한 정적 청사진. 특수 연결은 단서 공개 이후 표시해야 합니다. 선 교차는 방 연결이 아닙니다.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#547082" stroke-width="0.5" opacity="0.18"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#FF9F1C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif} .label{font-size:20px;fill:#DDEFF2;font-weight:600;text-anchor:middle}.prime{font-size:27px;fill:#00F5D4;font-weight:700;text-anchor:middle;dominant-baseline:central}.edge{fill:none;stroke:#00B9B2;stroke-width:2.5;opacity:.8}.special{fill:none;stroke:#FF9F1C;stroke-width:3;stroke-dasharray:9 7}.node{fill:#0B132B;fill-opacity:.94;stroke:#00F5D4;stroke-width:2}</style>
