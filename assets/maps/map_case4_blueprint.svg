<path id="edge-3-5" data-from="3" data-to="5" class="edge" d="M480,266.4 L201.6,504"/>
<path id="edge-3-7" data-from="3" data-to="7" class="edge" d="M480,266.4 L480,619.2"/>
<path id="edge-3-13" data-from="3" data-to="13" class="edge" d="M480,266.4 L758.4,504"/>
</g>
