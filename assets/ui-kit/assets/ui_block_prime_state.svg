<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-labelledby="title desc"><title id="title">소수 블록</title><desc id="desc">더 분해되지 않는 정상적인 소수 상태. 1009의 소수성과 기록 변조는 구분한다. value-slot 영역의 실제 값은 코드로 넣는다.</desc><path d="M14 2H226L238 14V106L226 118H14L2 106V14Z" fill="#0B132B" stroke="#9CAFC4" stroke-width="2"/><circle cx="25" cy="24" r="8" fill="none" stroke="#9CAFC4" stroke-width="2"/><circle cx="25" cy="24" r="2" fill="#9CAFC4"/><text x="45" y="30" fill="#9CAFC4" font-family="'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="16" text-anchor="start" >소수</text><path d="M18 42H222" stroke="#9CAFC4" stroke-opacity=".3"/><rect id="value-slot" x="24" y="51" width="192" height="53" fill="none"/></svg>