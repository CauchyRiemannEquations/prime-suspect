<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">논파 성공 진술 파편</title><desc id="desc">진술 오버레이 파편 장식. 카드나 실제 증거의 파괴를 뜻하지 않는다. CSS 한 번 재생, 반복 점멸 없음.</desc><g id="shard-0" class="ps-shard" style="--dx:-14px;--dy:-12px"><polygon points="160,120 260,60 310,116" fill="#00F5D4" fill-opacity=".06" stroke="#E7EFF7" stroke-opacity=".7" stroke-width="1.5"/></g><g id="shard-1" class="ps-shard" style="--dx:-2px;--dy:-18px"><polygon points="260,60 360,45 310,116" fill="#00F5D4" fill-opacity=".06" stroke="#E7EFF7" stroke-opacity=".7" stroke-width="1.5"/></g><g id="shard-2" class="ps-shard" style="--dx:12px;--dy:-13px"><polygon points="360,45 480,100 310,116" fill="#00F5D4" fill-opacity=".06" stroke="#E7EFF7" stroke-opacity=".7" stroke-width="1.5"/></g><g id="shard-3" class="ps-shard" style="--dx:18px;--dy:3px"><polygon points="480,100 500,170 310,116" fill="#00F5D4" fill-opacity=".06" stroke="#E7EFF7" stroke-opacity=".7" stroke-width="1.5"/></g><g id="shard-4" class="ps-shard" style="--dx:12px;--dy:14px"><polygon points="500,170 390,200 310,116" fill="#00F5D4" fill-opacity=".06" stroke="#E7EFF7" stroke-opacity=".7" stroke-width="1.5"/></g><g id="shard-5" class="ps-shard" style="--dx:0px;--dy:18px"><polygon points="390,200 290,195 310,116" fill="#00F5D4" fill-opacity=".06" stroke="#E7EFF7" stroke-opacity=".7" stroke-width="1.5"/></g><g id="shard-6" class="ps-shard" style="--dx:-16px;--dy:12px"><polygon points="290,195 165,175 310,116" fill="#00F5D4" fill-opacity=".06" stroke="#E7EFF7" stroke-opacity=".7" stroke-width="1.5"/></g><g id="shard-7" class="ps-shard" style="--dx:-20px;--dy:0px"><polygon points="165,175 160,120 310,116" fill="#00F5D4" fill-opacity=".06" stroke="#E7EFF7" stroke-opacity=".7" stroke-width="1.5"/></g></svg>