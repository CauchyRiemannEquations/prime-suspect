<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-labelledby="title desc"><title id="title">짝수 지수 블록</title><desc id="desc">짝수 횟수 통과 기록. 왕복과 양립하지만 무죄를 보장하지 않는다. value-slot 영역의 실제 값은 코드로 넣는다.</desc><path d="M14 2H226L238 14V106L226 118H14L2 106V14Z" fill="#0B132B" stroke="#00F5D4" stroke-width="2"/><path d="M18 22h14m-14 7h14" stroke="#00F5D4" stroke-width="3"/><text x="45" y="30" fill="#00F5D4" font-family="'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="16" text-anchor="start" >짝수 지수</text><path d="M18 42H222" stroke="#00F5D4" stroke-opacity=".3"/><rect id="value-slot" x="24" y="51" width="192" height="53" fill="none"/></svg>