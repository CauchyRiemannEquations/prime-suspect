<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-labelledby="title desc"><title id="title">홀수 지수 블록</title><desc id="desc">홀수 횟수 통과 기록. 단독 오류 또는 유죄 판정이 아니다. value-slot 영역의 실제 값은 코드로 넣는다.</desc><path d="M14 2H226L238 14V106L226 118H14L2 106V14Z" fill="#0B132B" stroke="#FF9F1C" stroke-width="2"/><path d="M25 16l8 14H17Z" fill="none" stroke="#FF9F1C" stroke-width="2"/><circle cx="25" cy="26" r="1" fill="#FF9F1C"/><text x="45" y="30" fill="#FF9F1C" font-family="'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="16" text-anchor="start" >홀수 지수</text><path d="M18 42H222" stroke="#FF9F1C" stroke-opacity=".3"/><rect id="value-slot" x="24" y="51" width="192" height="53" fill="none"/></svg>