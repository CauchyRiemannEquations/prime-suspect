<svg xmlns="http://www.w3.org/2000/svg" width="400" height="104" viewBox="0 0 400 104" role="img" aria-labelledby="title desc"><title id="title">모순 제시 버튼 idle</title><desc id="desc">버튼 시각 자산만 제공. 실제 버튼은 HTML button 및 사건 조건으로 구현한다. 게이지 없음.</desc><g opacity="1"><path d="M14 2H386L398 14V90L386 102H14L2 90V14Z" fill="#0B132B" stroke="#EF233C" stroke-width="2"/><rect x="12" y="12" width="376" height="80" rx="5" fill="#0B132B"/><path d="M26 29l12 12-12 12 12 12-12 12" fill="none" stroke="#EF233C" stroke-width="3"/><text x="211" y="61" fill="#E7EFF7" font-family="'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" font-size="29" text-anchor="middle" font-weight="700">모순 제시!</text></g></svg>